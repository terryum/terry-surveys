name: Weekly refresh

# Every Monday at 00:00 UTC, plus on-demand.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild refs index
        run: |
          python3 build.py --index

      - name: Generate weekly report
        id: report
        run: |
          python3 shared/weekly_report.py > weekly_report.md
          {
            echo 'REPORT<<EOF'
            cat weekly_report.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-refresh-report
          path: weekly_report.md
          retention-days: 90

      - name: Open (or update) tracking issue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Weekly refresh ${{ steps.date.outputs.today || github.run_id }}"
          content-filepath: weekly_report.md
          labels: weekly-refresh
