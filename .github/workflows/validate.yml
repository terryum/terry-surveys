name: Validate

# Block PRs / direct pushes that introduce broken figure paths, missing
# bibtex keys, unresolved citations, etc. — the structural invariants that
# `python3 build.py --validate --all` enforces.
#
# Origin: 2026-04 KAIST IP retry storm. The standalone-era ch10.html was
# deployed referencing /assets/figures/ch10/fig_10_X_*.png while the actual
# files had been renamed to flat naming. An external automated client looped
# on the resulting 404s for 4 days. The new SUBFOLDER_FIGURE_RE rule in
# shared/validate.py catches that exact pattern; this workflow makes sure
# the rule fires before merge instead of after deploy.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate all surveys
        run: python3 build.py --validate --all
