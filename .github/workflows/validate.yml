name: Validate framework

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate survey skill
        run: python3 scripts/validate-skill.py .codex/skills/survey
      - name: Run framework and harness tests
        run: python3 -m unittest discover -s survey_harness/tests -v
